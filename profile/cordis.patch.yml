# Estimated session cost beside the composer. Each provider's published list is
# quoted in its own currency — DeepSeek in CNY, Google in USD — so `rates` holds
# the display units per unit of each base currency, and the panel splits the
# total by API key. `language: auto` follows the app locale; `ru`, `en` and `zh`
# force the panel copy.
- id: session-cost
  name: "@local/session-cost"
  config:
    rates:
      CNY: 12.0557
      USD: 80.53
    secondary:
      currency: USD
      symbol: "$"
    providers:
      deepseek-official:
        label: DeepSeek · DEEPSEEK_API_KEY
      google:
        label: Google · GOOGLE_API_KEY
